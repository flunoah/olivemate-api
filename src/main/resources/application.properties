spring.application.name=mate

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

spring.task.scheduling.pool.size=5

jwt.secret=${JWT_SECRET}
jwt.expire-ms=${JWT_EXPIRE_MS:0}

admin.secret.key=${ADMIN_SECRET_KEY:mate-admin-secret-key}

logging.level.root=INFO
logging.level.com.oliveyoung.mate=DEBUG

spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

push.vapid.public-key=${VAPID_PUBLIC_KEY}
push.vapid.private-key=${VAPID_PRIVATE_KEY}
push.vapid.subject=mailto:admin@oliveyoung.com

telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}
anthropic.api.key=${ANTHROPIC_API_KEY:}
