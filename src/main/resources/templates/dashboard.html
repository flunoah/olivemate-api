<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-[#F4F6F1] min-h-screen pb-24">
    <div class="max-w-sm mx-auto p-5">
        <div class="flex items-center justify-between mb-4">
            <div class="text-lg font-extrabold tracking-tight">마이자소</div>
            <a href="/notifications" class="relative text-gray-700">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1112 0v5l2 3H4l2-3z"/></svg>
                <span th:if="${hasUnreadNotifications}" class="absolute -top-0.5 -right-0.5 w-1.5 h-1.5 rounded-full bg-accent"></span>
            </a>
        </div>

        <p th:if="${message}" th:text="${message}" class="text-brand-strong bg-[#F1FCE6] text-sm font-semibold rounded-xl px-4 py-2.5 mb-3"></p>
        <p th:if="${error}" th:text="${error}" class="text-red-600 bg-red-50 text-sm font-semibold rounded-xl px-4 py-2.5 mb-3"></p>

        <!-- 포인트 잔액 카드 -->
        <div class="bg-brand text-brand-ink rounded-2xl p-5 mb-5">
            <p class="text-xs font-bold opacity-70 mb-1">사용 가능 포인트</p>
            <p class="text-4xl font-extrabold tracking-tight" th:text="${#numbers.formatInteger(balance.balance, 1, 'COMMA')} + 'P'"></p>
            <div th:if="${balance.expiringIn7Days > 0}" class="mt-2.5 rounded-xl bg-black/10 px-3.5 py-2.5 text-sm font-bold">
                <span th:text="${#numbers.formatInteger(balance.expiringIn7Days, 1, 'COMMA')} + 'P가 7일 내에 만료돼요'"></span>
            </div>
        </div>

        <!-- 이번 주 근무 -->
        <div class="flex items-center justify-between mb-3">
            <div class="text-base font-extrabold">이번 주 근무</div>
        </div>
        <div class="grid grid-cols-7 gap-1.5 mb-2">
            <div th:each="d : ${weekDays}" class="flex flex-col items-center gap-1.5">
                <div class="text-xs text-gray-400 font-semibold" th:text="${d.dayLabel}"></div>
                <div class="w-full aspect-square rounded-xl flex items-center justify-center text-sm font-bold"
                     th:classappend="${d.absent ? 'bg-red-50 text-red-400' :
                                      (d.registered and d.scheduled) ? 'bg-brand text-brand-ink' :
                                      (d.registered and !d.scheduled) ? 'border-2 border-dashed border-brand text-brand-strong' :
                                      (d.scheduled and !d.isPast) ? 'border border-brand text-brand-strong' :
                                      'bg-gray-100 text-gray-400'}"
                     th:text="${#temporals.day(d.date)}"></div>
            </div>
        </div>
        <div class="flex items-center gap-4 text-xs text-gray-400 font-semibold mb-4">
            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-brand"></span>소정근무</div>
            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm border-2 border-dashed border-brand"></span>연장근무</div>
        </div>

        <button type="button" onclick="openSheet('workSheet')"
                class="w-full flex items-center justify-between rounded-xl border border-gray-200 px-4 py-3.5 text-sm font-bold mb-24">
            근무 등록 · 수정
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-400"><path d="M9 5l7 7-7 7"/></svg>
        </button>
    </div>

    <!-- 포인트 사용 플로팅 버튼 -->
    <button type="button" onclick="backToSearch(); openSheet('pointsSheet')"
            class="fixed left-1/2 -translate-x-1/2 bottom-19 w-[calc(100%-40px)] max-w-86 flex items-center justify-center gap-2 h-13 rounded-2xl bg-brand text-brand-ink font-bold shadow-lg z-40">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M12 5v14M5 12h14"/></svg>
        포인트 사용
    </button>

    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <!-- 근무 등록 바텀시트 (S7) -->
    <div id="workSheet" class="hidden fixed inset-0 z-60">
        <div class="absolute inset-0 bg-black/40" onclick="closeSheet('workSheet')"></div>
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white rounded-t-2xl p-5 max-h-[85vh] overflow-y-auto">
            <div class="w-11 h-1 rounded-full bg-gray-200 mx-auto mb-4"></div>
            <div class="flex items-baseline justify-between mb-4">
                <div class="text-lg font-extrabold">이번 주 근무 등록</div>
                <div class="text-xs text-gray-400 font-semibold"
                     th:text="${#temporals.format(weekDays[0].date, 'M/d')} + ' - ' + ${#temporals.format(weekDays[6].date, 'M/d')}"></div>
            </div>

            <p class="text-xs font-bold text-gray-500 mb-2" th:text="'소정근무일 (내 기본 요일: ' + ${scheduledDaysLabel} + ')'"></p>
            <div class="grid grid-cols-7 gap-1.5 mb-2">
                <button type="button" th:each="d : ${weekDays}" class="work-chip flex flex-col items-center gap-1 py-2 rounded-xl text-sm font-bold"
                        th:attr="data-date=${d.date},data-tappable=${d.showAbsent or d.showReinstate or d.showRegister},data-initial=${d.registered and !d.absent},data-show-reinstate=${d.showReinstate},data-show-register=${d.showRegister}"
                        th:disabled="${!(d.showAbsent or d.showReinstate or d.showRegister)}">
                    <span class="text-[11px] font-semibold text-gray-400" th:text="${d.dayLabel}"></span>
                    <span class="w-8 h-8 rounded-lg flex items-center justify-center chip-mark" th:text="${#temporals.day(d.date)}"></span>
                </button>
            </div>
            <p class="text-xs text-gray-400 mb-4">탭해서 해제하면 결근으로 기록되고 적립되지 않아요</p>

            <p class="text-xs font-bold text-gray-500 mb-2">연장근무</p>
            <div id="extraDaysList" class="space-y-2 mb-2">
                <div th:each="d : ${weekDays}" th:if="${d.registered and !d.scheduled}"
                     class="extra-chip flex items-center justify-between rounded-xl border-2 border-dashed border-brand px-4 py-3"
                     th:attr="data-date=${d.date}">
                    <span class="text-sm font-bold" th:text="${d.dayLabel} + ' ' + ${#temporals.format(d.date, 'M월 d일')} + ' · 연장근무'"></span>
                    <button type="button" class="extra-remove-btn text-gray-400 hover:text-red-500 text-lg leading-none">&times;</button>
                </div>
            </div>
            <button type="button" onclick="addExtraDay()"
                    class="w-full flex items-center justify-center gap-1.5 h-11 rounded-xl border border-gray-200 text-sm font-bold text-gray-500 mb-1">
                <span class="text-lg leading-none">+</span> 연장근무 날짜 추가
            </button>
            <input type="date" id="extraDayPicker" class="hidden w-full h-11 border border-gray-200 rounded-xl px-4 text-sm mt-1"/>

            <div id="workPreviewBox" class="rounded-xl bg-[#F1FCE6] border border-[#CFEFB4] px-4 py-3 text-xs text-[#24450A] font-semibold mt-4"></div>

            <div class="flex gap-2 mt-4">
                <button type="button" onclick="closeSheet('workSheet')"
                        class="h-13 px-5 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold rounded-xl transition">닫기</button>
                <button type="button" onclick="saveWorkSheet()"
                        class="flex-1 h-13 bg-brand hover:bg-brand-strong text-brand-ink hover:text-white font-bold rounded-xl transition">저장하기</button>
            </div>
        </div>
    </div>

    <!-- 포인트 사용 바텀시트: 1단계 상품 찾기(S8) → 2단계 FIFO 미리보기(S9) → 3단계 완료(S10) -->
    <div id="pointsSheet" class="hidden fixed inset-0 z-60">
        <div class="absolute inset-0 bg-black/40" onclick="closeSheet('pointsSheet')"></div>
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white rounded-t-2xl p-5 max-h-[85vh] overflow-y-auto">
            <div class="w-11 h-1 rounded-full bg-gray-200 mx-auto mb-4"></div>
            <form th:action="@{/dashboard/points/use}" method="post">
                <div id="pointsStep1">
                    <div class="flex items-center justify-between mb-3">
                        <button type="button" onclick="closeSheet('pointsSheet')" class="text-gray-400 text-xl leading-none">&times;</button>
                        <span class="text-sm font-bold">포인트 사용</span>
                        <span class="text-xs text-gray-300 font-semibold">1/3</span>
                    </div>
                    <div class="h-1 bg-gray-100 rounded-full mb-4"><div class="h-1 w-1/3 bg-brand rounded-full"></div></div>

                    <div class="text-lg font-extrabold mb-3">어떤 상품을 구매했나요?</div>
                    <div class="relative mb-3">
                        <input type="text" name="productName" id="productName" required placeholder="상품명을 입력해 주세요." autocomplete="off"
                               class="w-full h-13 border border-gray-200 rounded-xl px-4 text-sm focus:outline-none focus:ring-2 focus:ring-brand"/>
                    </div>
                    <button type="button" id="pointsNextBtn" onclick="goToPreview()"
                            class="w-full h-13 bg-brand hover:bg-brand-strong text-brand-ink hover:text-white font-bold rounded-xl transition">다음</button>
                </div>

                <div id="pointsStep2" class="hidden">
                    <div class="flex items-center justify-between mb-3">
                        <button type="button" onclick="backToSearch()" class="text-gray-400">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 19l-7-7 7-7"/></svg>
                        </button>
                        <span class="text-sm font-bold">포인트 사용</span>
                        <span class="text-xs text-gray-300 font-semibold">2/3</span>
                    </div>
                    <div class="h-1 bg-gray-100 rounded-full mb-4"><div class="h-1 w-2/3 bg-brand rounded-full"></div></div>

                    <div class="flex items-center justify-between rounded-xl border border-gray-200 px-4 py-3 mb-4">
                        <div class="min-w-0">
                            <p id="selectedProductName" class="text-sm font-bold truncate"></p>
                        </div>
                        <button type="button" onclick="backToSearch()" class="text-xs font-bold text-gray-400 flex-none ml-2">변경</button>
                    </div>

                    <p class="text-xs font-bold text-gray-500 mb-1">사용할 포인트</p>
                    <div class="flex items-center justify-between mb-3">
                        <input type="number" name="amount" id="pointsAmount" min="1" required placeholder="0"
                               hx-post="/dashboard/points/preview" hx-trigger="keyup changed delay:400ms, change"
                               hx-target="#usePreviewArea"
                               class="text-3xl font-extrabold w-2/3 focus:outline-none border-b-2 border-gray-100 focus:border-brand pb-1"/>
                        <button type="button" onclick="useFullAmount()"
                                class="text-xs font-bold text-brand-strong bg-[#F1FCE6] rounded-full px-3 py-1.5"
                                th:text="'전액 ' + ${#numbers.formatInteger(balance.balance, 1, 'COMMA')} + 'P'"></button>
                    </div>

                    <div id="usePreviewArea" class="mb-3"></div>

                    <button type="submit" id="useSubmitBtn"
                            class="w-full h-13 bg-brand hover:bg-brand-strong text-brand-ink hover:text-white font-bold rounded-xl transition">사용하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 사용 완료 (S10) -->
    <div th:if="${usedResult}" class="fixed inset-0 z-80 bg-white flex flex-col items-center justify-center px-8 text-center">
        <div class="w-20 h-20 rounded-full bg-brand flex items-center justify-center mb-5">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        </div>
        <p class="text-xl font-extrabold mb-1" th:text="${#numbers.formatInteger(usedResult.amount, 1, 'COMMA')} + 'P 사용 완료'"></p>
        <p class="text-sm text-gray-500 mb-1" th:text="${usedResult.product} + ' · ' + ${#temporals.format(usedResult.usedDate, 'M월 d일')}"></p>
        <p class="text-sm text-gray-400 mb-5">남은 포인트 <span th:text="${#numbers.formatInteger(balance.balance, 1, 'COMMA')} + 'P'"></span></p>
        <div class="rounded-xl bg-[#F1FCE6] border border-[#CFEFB4] px-4 py-3 text-xs text-[#24450A] font-semibold mb-6 max-w-xs leading-relaxed">
            잘못 등록했다면 오늘 안에 내역에서 취소할 수 있어요. 자정이 지나면 관리자 문의가 필요해요.
        </div>
        <a th:href="@{/history}" class="w-full max-w-xs h-13 flex items-center justify-center bg-brand hover:bg-brand-strong text-brand-ink hover:text-white font-bold rounded-xl mb-2 transition">내역에서 확인하기</a>
        <a th:href="@{/dashboard}" class="w-full max-w-xs h-13 flex items-center justify-center text-gray-500 font-bold">홈으로</a>
    </div>

    <style>
        .work-chip[data-tappable="false"] { opacity: .4; }
        .work-chip[data-current="true"] .chip-mark { background: var(--color-brand); color: var(--color-brand-ink); }
        .work-chip[data-current="false"] .chip-mark { background: #F3F4F6; color: #9CA3AF; }
    </style>

    <script th:inline="javascript">
        var POINTS_PER_DAY = /*[[${pointsPerDay}]]*/ 1000;

        function openSheet(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeSheet(id) { document.getElementById(id).classList.add('hidden'); }

        // ── S7 근무 등록 시트 ───────────────────────
        var workChips = Array.from(document.querySelectorAll('.work-chip'));
        var workState = {}; // date -> 'REGISTERED' | 'ABSENT'
        workChips.forEach(function (chip) {
            var date = chip.dataset.date;
            workState[date] = chip.dataset.initial === 'true' ? 'REGISTERED' : 'ABSENT';
            chip.dataset.current = workState[date] === 'REGISTERED';
            if (chip.dataset.tappable === 'true') {
                chip.addEventListener('click', function () {
                    workState[date] = workState[date] === 'REGISTERED' ? 'ABSENT' : 'REGISTERED';
                    chip.dataset.current = workState[date] === 'REGISTERED';
                    updateWorkPreview();
                });
            }
        });

        var extraState = {}; // date -> true(유지) — 제거되면 키 삭제
        document.querySelectorAll('.extra-chip').forEach(function (chip) {
            extraState[chip.dataset.date] = true;
            chip.querySelector('.extra-remove-btn').addEventListener('click', function () {
                delete extraState[chip.dataset.date];
                chip.remove();
                updateWorkPreview();
            });
        });

        function addExtraDay() {
            var picker = document.getElementById('extraDayPicker');
            if (picker.classList.contains('hidden')) {
                picker.classList.remove('hidden');
                picker.min = new Date().toISOString().slice(0, 10);
                picker.focus();
                picker.onchange = function () {
                    var date = picker.value;
                    if (!date || extraState[date] || workState[date] !== undefined) { picker.value = ''; return; }
                    extraState[date] = true;
                    var row = document.createElement('div');
                    row.className = 'extra-chip flex items-center justify-between rounded-xl border-2 border-dashed border-brand px-4 py-3';
                    row.dataset.date = date;
                    var dObj = new Date(date + 'T00:00:00');
                    var label = (dObj.getMonth() + 1) + '월 ' + dObj.getDate() + '일 · 연장근무';
                    row.innerHTML = '<span class="text-sm font-bold">' + label + '</span>' +
                        '<button type="button" class="extra-remove-btn text-gray-400 hover:text-red-500 text-lg leading-none">&times;</button>';
                    row.querySelector('.extra-remove-btn').addEventListener('click', function () {
                        delete extraState[date];
                        row.remove();
                        updateWorkPreview();
                    });
                    document.getElementById('extraDaysList').appendChild(row);
                    picker.value = '';
                    picker.classList.add('hidden');
                    updateWorkPreview();
                };
            }
        }

        function updateWorkPreview() {
            var registeredCount = Object.keys(workState).filter(function (d) { return workState[d] === 'REGISTERED'; }).length
                + Object.keys(extraState).length;
            var points = registeredCount * POINTS_PER_DAY;
            document.getElementById('workPreviewBox').innerHTML =
                '등록한 근무 ' + registeredCount + '일 → 내일 오전 1시에 ' + points.toLocaleString('ko-KR') + 'P 적립 예정 · 적립일부터 31일 후 소멸';
        }
        updateWorkPreview();

        var INITIAL_EXTRA_DATES = Array.from(document.querySelectorAll('#extraDaysList .extra-chip')).map(function (c) { return c.dataset.date; });

        function saveWorkSheet() {
            var requests = [];
            workChips.forEach(function (chip) {
                var date = chip.dataset.date;
                var wasRegistered = chip.dataset.initial === 'true';
                var isRegistered = workState[date] === 'REGISTERED';
                if (wasRegistered === isRegistered) return;
                var url = isRegistered
                    ? (chip.dataset.showReinstate === 'true' ? '/dashboard/workdays/reinstate' : '/dashboard/workdays/register')
                    : '/dashboard/workdays/cancel';
                requests.push(postWorkDay(url, date));
            });
            // 새로 추가된(원래 없던) 연장근무 등록
            Object.keys(extraState).forEach(function (date) {
                if (INITIAL_EXTRA_DATES.indexOf(date) === -1) requests.push(postWorkDay('/dashboard/workdays/register', date));
            });
            // X로 제거된 기존 연장근무는 결근 처리
            INITIAL_EXTRA_DATES.forEach(function (date) {
                if (!extraState[date]) requests.push(postWorkDay('/dashboard/workdays/cancel', date));
            });
            Promise.all(requests).finally(function () { location.reload(); });
        }

        function postWorkDay(url, date) {
            var body = new URLSearchParams({ workDate: date });
            return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body });
        }

        // ── S8~S10 포인트 사용 시트 ─────────────────
        function goToPreview() {
            var name = document.getElementById('productName').value.trim();
            if (!name) return;
            document.getElementById('selectedProductName').textContent = name;
            document.getElementById('pointsStep1').classList.add('hidden');
            document.getElementById('pointsStep2').classList.remove('hidden');
        }

        function backToSearch() {
            document.getElementById('pointsStep2').classList.add('hidden');
            document.getElementById('pointsStep1').classList.remove('hidden');
        }

        function useFullAmount() {
            var input = document.getElementById('pointsAmount');
            input.value = /*[[${balance.balance}]]*/ 0;
            htmx.trigger(input, 'change');
        }

        document.getElementById('pointsAmount').addEventListener('input', function () {
            var amount = Number(this.value) || 0;
            document.getElementById('useSubmitBtn').textContent = amount > 0 ? amount.toLocaleString('ko-KR') + 'P 사용하기' : '사용하기';
        });
    </script>
</body>
</html>
