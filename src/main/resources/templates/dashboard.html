<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 min-h-screen pb-20">
    <div class="max-w-sm mx-auto p-6">
        <div class="flex items-center justify-between mb-6">
            <div class="text-lg font-bold text-gray-800">홈</div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="text-sm text-gray-400 hover:text-red-500">로그아웃</button>
            </form>
        </div>

        <p th:if="${message}" th:text="${message}" class="text-green-700 bg-green-50 text-sm rounded-lg px-4 py-2 mb-4"></p>
        <p th:if="${error}" th:text="${error}" class="text-red-600 bg-red-50 text-sm rounded-lg px-4 py-2 mb-4"></p>

        <!-- 포인트 잔액 카드 -->
        <div class="bg-green-50 rounded-2xl p-5 mb-4 text-center">
            <p class="text-xs text-green-600 mb-1">현재 보유 포인트</p>
            <p class="text-3xl font-bold text-green-700" th:text="${#numbers.formatInteger(balance.balance, 1, 'COMMA')} + 'P'"></p>
            <p th:if="${balance.expiringIn7Days > 0}" class="text-xs text-orange-500 mt-2"
               th:text="${#numbers.formatInteger(balance.expiringIn7Days, 1, 'COMMA')} + 'P가 7일 내에 만료돼요'"></p>
            <div class="grid grid-cols-3 gap-2 mt-4 text-xs text-gray-500">
                <div><span class="block font-medium text-gray-700" th:text="${#numbers.formatInteger(balance.monthlyEarned, 1, 'COMMA')}"></span>이번 달 적립</div>
                <div><span class="block font-medium text-gray-700" th:text="${#numbers.formatInteger(balance.monthlyUsed, 1, 'COMMA')}"></span>이번 달 사용</div>
                <div><span class="block font-medium text-gray-700" th:text="${#numbers.formatInteger(balance.monthlyExpiring, 1, 'COMMA')}"></span>이번 달 소멸 예정</div>
            </div>
        </div>

        <!-- 되돌리기 카운트다운 -->
        <div th:if="${pendingUndo}" id="undo-bar"
             class="bg-gray-800 text-white rounded-xl px-4 py-3 mb-4 flex items-center justify-between text-sm">
            <span>
                <span th:text="${#numbers.formatInteger(pendingUndo.amount, 1, 'COMMA')} + 'P 사용 완료 — ' + ${pendingUndo.product}"></span>
                <span class="block text-gray-300 text-xs">취소 가능 <span id="undo-countdown">10</span>초</span>
            </span>
            <form th:action="@{/dashboard/points/cancel}" method="post">
                <input type="hidden" name="ledgerId" th:value="${pendingUndo.ledgerId}"/>
                <button type="submit" class="bg-white text-gray-800 text-xs font-medium px-3 py-1.5 rounded-lg">취소</button>
            </form>
        </div>

        <!-- 이번 주 근무 현황 -->
        <div class="bg-white rounded-2xl shadow-sm p-5 mb-4">
            <p class="text-sm font-medium text-gray-700 mb-3">이번 주 근무 현황</p>
            <div th:each="d : ${weekDays}"
                 class="flex items-center justify-between py-2.5 border-t border-gray-100 first:border-t-0">
                <div class="flex items-center gap-3">
                    <span class="w-6 text-center text-sm font-medium text-gray-700" th:text="${d.dayLabel}"></span>
                    <span class="text-sm text-gray-500" th:text="${d.date}"></span>
                    <span th:if="${!d.statusLabel.isEmpty()}" class="text-xs px-2 py-1 rounded-full"
                          th:text="${d.statusLabel}"
                          th:style="'color:' + ${d.statusColor} + ';background:' + ${d.statusBg}"></span>
                </div>
                <div class="flex items-center gap-2">
                    <form th:if="${d.showRegister}" th:action="@{/dashboard/workdays/register}" method="post">
                        <input type="hidden" name="workDate" th:value="${d.date}"/>
                        <button type="submit" class="text-xs text-green-600 hover:text-green-700">등록</button>
                    </form>
                    <form th:if="${d.showAbsent}" th:action="@{/dashboard/workdays/cancel}" method="post">
                        <input type="hidden" name="workDate" th:value="${d.date}"/>
                        <button type="submit" class="text-xs text-gray-400 hover:text-red-500">결근</button>
                    </form>
                    <form th:if="${d.showReinstate}" th:action="@{/dashboard/workdays/reinstate}" method="post">
                        <input type="hidden" name="workDate" th:value="${d.date}"/>
                        <button type="submit" class="text-xs text-gray-400 hover:text-green-600">결근 취소</button>
                    </form>
                    <form th:if="${d.showCancel}" th:action="@{/dashboard/workdays/cancel}" method="post">
                        <input type="hidden" name="workDate" th:value="${d.date}"/>
                        <button type="submit" class="text-xs text-gray-400 hover:text-red-500">삭제</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 연장근무 등록 -->
        <div th:if="${!extraDays.isEmpty()}" class="bg-white rounded-2xl shadow-sm p-5 mb-4">
            <p class="text-sm font-medium text-gray-700 mb-3">연장근무 등록</p>
            <div th:each="d : ${extraDays}" class="flex items-center justify-between py-2 border-t border-gray-100 first:border-t-0">
                <span class="text-sm text-gray-600" th:text="${d.dayLabel} + ' ' + ${d.date}"></span>
                <form th:action="@{/dashboard/workdays/register}" method="post">
                    <input type="hidden" name="workDate" th:value="${d.date}"/>
                    <button type="submit" class="text-xs text-green-600 hover:text-green-700">등록</button>
                </form>
            </div>
        </div>

        <!-- 포인트 사용 -->
        <div class="bg-white rounded-2xl shadow-sm p-5">
            <p class="text-sm font-medium text-gray-700 mb-3">포인트 사용</p>
            <form th:action="@{/dashboard/points/use}" method="post" class="space-y-3">
                <input type="date" name="usedAt" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500"/>
                <input type="number" name="amount" min="1" required placeholder="사용 포인트"
                       class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500"/>
                <input type="text" name="productName" required placeholder="제품명 입력"
                       class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500"/>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 rounded-lg transition">사용하기</button>
            </form>
        </div>
    </div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <script th:if="${pendingUndo}">
        (function () {
            var seconds = 10;
            var countdownEl = document.getElementById('undo-countdown');
            var barEl = document.getElementById('undo-bar');
            var timer = setInterval(function () {
                seconds -= 1;
                if (seconds <= 0) {
                    clearInterval(timer);
                    if (barEl) barEl.style.display = 'none';
                    return;
                }
                if (countdownEl) countdownEl.textContent = seconds;
            }, 1000);
        })();
    </script>
</body>
</html>
