<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-[#F4F6F1] min-h-screen pb-24">
    <div class="max-w-sm mx-auto p-5">
        <div class="flex items-center justify-between mb-4">
            <div class="text-lg font-extrabold tracking-tight">마이자소</div>
            <a href="/notifications" class="relative text-gray-700">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1112 0v5l2 3H4l2-3z"/></svg>
                <span th:if="${hasUnreadNotifications}" class="absolute -top-0.5 -right-0.5 w-1.5 h-1.5 rounded-full bg-accent"></span>
            </a>
        </div>

        <p th:if="${message}" th:text="${message}" class="text-brand-strong bg-[#F1FCE6] text-sm font-semibold rounded-xl px-4 py-2.5 mb-3"></p>
        <p th:if="${error}" th:text="${error}" class="text-red-600 bg-red-50 text-sm font-semibold rounded-xl px-4 py-2.5 mb-3"></p>

        <!-- 포인트 잔액 카드 -->
        <div class="bg-brand text-brand-ink rounded-2xl p-5 mb-5">
            <p class="text-xs font-bold opacity-70 mb-1">사용 가능 포인트</p>
            <p class="text-4xl font-extrabold tracking-tight" th:text="${#numbers.formatInteger(balance.balance, 1, 'COMMA')} + 'P'"></p>
            <div th:if="${balance.expiringIn7Days > 0}" class="mt-2.5 rounded-xl bg-black/10 px-3.5 py-2.5 text-sm font-bold">
                <span th:text="${#numbers.formatInteger(balance.expiringIn7Days, 1, 'COMMA')} + 'P가 7일 내에 만료돼요'"></span>
            </div>
        </div>

        <!-- 되돌리기 카운트다운 -->
        <div th:if="${pendingUndo}" id="undo-bar"
             class="bg-gray-800 text-white rounded-xl px-4 py-3 mb-5 flex items-center justify-between text-sm">
            <span>
                <span th:text="${#numbers.formatInteger(pendingUndo.amount, 1, 'COMMA')} + 'P 사용 완료 — ' + ${pendingUndo.product}"></span>
                <span class="block text-gray-300 text-xs">취소 가능 <span id="undo-countdown">10</span>초</span>
            </span>
            <form th:action="@{/dashboard/points/cancel}" method="post">
                <input type="hidden" name="ledgerId" th:value="${pendingUndo.ledgerId}"/>
                <button type="submit" class="bg-white text-gray-800 text-xs font-bold px-3 py-1.5 rounded-lg">취소</button>
            </form>
        </div>

        <!-- 이번 주 근무 -->
        <div class="flex items-center justify-between mb-3">
            <div class="text-base font-extrabold">이번 주 근무</div>
        </div>
        <div class="grid grid-cols-7 gap-1.5 mb-2">
            <div th:each="d : ${weekDays}" class="flex flex-col items-center gap-1.5">
                <div class="text-xs text-gray-400 font-semibold" th:text="${d.dayLabel}"></div>
                <div class="w-full aspect-square rounded-xl flex items-center justify-center text-sm font-bold"
                     th:classappend="${d.absent ? 'bg-red-50 text-red-400' :
                                      (d.registered and d.scheduled) ? 'bg-brand text-brand-ink' :
                                      (d.registered and !d.scheduled) ? 'border-2 border-dashed border-brand text-brand-strong' :
                                      (d.scheduled and !d.isPast) ? 'border border-brand text-brand-strong' :
                                      'bg-gray-100 text-gray-400'}"
                     th:text="${#temporals.day(d.date)}"></div>
            </div>
        </div>
        <div class="flex items-center gap-4 text-xs text-gray-400 font-semibold mb-4">
            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-brand"></span>소정근무</div>
            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm border-2 border-dashed border-brand"></span>연장근무</div>
        </div>

        <button type="button" onclick="openSheet('workSheet')"
                class="w-full flex items-center justify-between rounded-xl border border-gray-200 px-4 py-3.5 text-sm font-bold mb-24">
            근무 등록 · 수정
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-400"><path d="M9 5l7 7-7 7"/></svg>
        </button>
    </div>

    <!-- 포인트 사용 플로팅 버튼 -->
    <button type="button" onclick="openSheet('pointsSheet')"
            class="fixed left-1/2 -translate-x-1/2 bottom-[76px] w-[calc(100%-40px)] max-w-[344px] flex items-center justify-center gap-2 h-[52px] rounded-2xl bg-brand text-brand-ink font-bold shadow-lg z-40">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M12 5v14M5 12h14"/></svg>
        포인트 사용
    </button>

    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <!-- 근무 등록 바텀시트 (S7) -->
    <div id="workSheet" class="hidden fixed inset-0 z-[60]">
        <div class="absolute inset-0 bg-black/40" onclick="closeSheet('workSheet')"></div>
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white rounded-t-2xl p-5 max-h-[85vh] overflow-y-auto">
            <div class="w-11 h-1 rounded-full bg-gray-200 mx-auto mb-4"></div>
            <div class="text-lg font-extrabold mb-4">이번 주 근무 등록</div>

            <div th:each="d : ${weekDays}" class="flex items-center justify-between py-2.5 border-t border-gray-100 first:border-t-0">
                <div class="flex items-center gap-3">
                    <span class="w-6 text-center text-sm font-bold" th:text="${d.dayLabel}"></span>
                    <span class="text-sm text-gray-500" th:text="${d.date}"></span>
                    <span th:if="${!d.statusLabel.isEmpty()}" class="text-xs font-bold px-2 py-1 rounded-full"
                          th:text="${d.statusLabel}"
                          th:style="'color:' + ${d.statusColor} + ';background:' + ${d.statusBg}"></span>
                </div>
                <div class="flex items-center gap-2">
                    <form th:if="${d.showRegister}" th:action="@{/dashboard/workdays/register}" method="post">
                        <input type="hidden" name="workDate" th:value="${d.date}"/>
                        <button type="submit" class="text-xs font-bold text-brand-strong">등록</button>
                    </form>
                    <form th:if="${d.showAbsent}" th:action="@{/dashboard/workdays/cancel}" method="post">
                        <input type="hidden" name="workDate" th:value="${d.date}"/>
                        <button type="submit" class="text-xs font-bold text-gray-400 hover:text-red-500">결근</button>
                    </form>
                    <form th:if="${d.showReinstate}" th:action="@{/dashboard/workdays/reinstate}" method="post">
                        <input type="hidden" name="workDate" th:value="${d.date}"/>
                        <button type="submit" class="text-xs font-bold text-gray-400 hover:text-brand-strong">결근 취소</button>
                    </form>
                    <form th:if="${d.showCancel}" th:action="@{/dashboard/workdays/cancel}" method="post">
                        <input type="hidden" name="workDate" th:value="${d.date}"/>
                        <button type="submit" class="text-xs font-bold text-gray-400 hover:text-red-500">삭제</button>
                    </form>
                </div>
            </div>

            <div th:if="${!extraDays.isEmpty()}" class="mt-4 pt-4 border-t border-gray-100">
                <p class="text-sm font-bold text-gray-500 mb-3">연장근무</p>
                <div th:each="d : ${extraDays}"
                     class="flex items-center justify-between rounded-xl border-2 border-dashed border-brand px-4 py-3 mb-2">
                    <span class="text-sm font-bold" th:text="${d.dayLabel} + ' ' + ${d.date}"></span>
                    <form th:action="@{/dashboard/workdays/register}" method="post">
                        <input type="hidden" name="workDate" th:value="${d.date}"/>
                        <button type="submit" class="text-xs font-bold text-brand-strong">등록</button>
                    </form>
                </div>
            </div>

            <div class="rounded-xl bg-[#F1FCE6] border border-[#CFEFB4] px-4 py-3 text-xs text-[#24450A] font-semibold mt-4">
                등록한 근무는 <b>다음날 오전 1시</b>에 적립되고, 적립일부터 <b>31일 후</b> 소멸돼요.
            </div>

            <button type="button" onclick="closeSheet('workSheet')"
                    class="w-full h-[52px] mt-4 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold rounded-xl transition">
                닫기
            </button>
        </div>
    </div>

    <!-- 포인트 사용 바텀시트 -->
    <div id="pointsSheet" class="hidden fixed inset-0 z-[60]">
        <div class="absolute inset-0 bg-black/40" onclick="closeSheet('pointsSheet')"></div>
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white rounded-t-2xl p-5">
            <div class="w-11 h-1 rounded-full bg-gray-200 mx-auto mb-4"></div>
            <div class="text-lg font-extrabold mb-4">포인트 사용</div>
            <form th:action="@{/dashboard/points/use}" method="post" class="space-y-3">
                <input type="date" name="usedAt" class="w-full h-[52px] border border-gray-200 rounded-xl px-4 text-sm focus:outline-none focus:ring-2 focus:ring-brand"/>
                <input type="number" name="amount" min="1" required placeholder="사용 포인트"
                       class="w-full h-[52px] border border-gray-200 rounded-xl px-4 text-sm focus:outline-none focus:ring-2 focus:ring-brand"/>
                <input type="text" name="productName" required placeholder="제품명 입력"
                       class="w-full h-[52px] border border-gray-200 rounded-xl px-4 text-sm focus:outline-none focus:ring-2 focus:ring-brand"/>
                <button type="submit" class="w-full h-[52px] bg-brand hover:bg-brand-strong text-brand-ink hover:text-white font-bold rounded-xl transition">사용하기</button>
            </form>
            <button type="button" onclick="closeSheet('pointsSheet')"
                    class="w-full h-[52px] mt-2 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold rounded-xl transition">
                닫기
            </button>
        </div>
    </div>

    <script>
        function openSheet(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeSheet(id) { document.getElementById(id).classList.add('hidden'); }
    </script>

    <script th:if="${pendingUndo}">
        (function () {
            var seconds = 10;
            var countdownEl = document.getElementById('undo-countdown');
            var barEl = document.getElementById('undo-bar');
            var timer = setInterval(function () {
                seconds -= 1;
                if (seconds <= 0) {
                    clearInterval(timer);
                    if (barEl) barEl.style.display = 'none';
                    return;
                }
                if (countdownEl) countdownEl.textContent = seconds;
            }, 1000);
        })();
    </script>
</body>
</html>
