<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-[#F4F6F1] min-h-screen pb-24">
    <div class="max-w-sm mx-auto p-5">
        <div class="flex items-center justify-between mb-4">
            <div class="text-lg font-extrabold tracking-tight">내역</div>
            <a th:href="@{/notifications}" class="relative text-gray-700">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1112 0v5l2 3H4l2-3z"/></svg>
                <span th:if="${hasUnreadNotifications}" class="absolute -top-0.5 -right-0.5 w-1.5 h-1.5 rounded-full bg-accent"></span>
            </a>
        </div>

        <p th:if="${message}" th:text="${message}" class="text-brand-strong bg-[#F1FCE6] text-sm font-semibold rounded-xl px-4 py-2.5 mb-3"></p>
        <p th:if="${error}" th:text="${error}" class="text-red-600 bg-red-50 text-sm font-semibold rounded-xl px-4 py-2.5 mb-3"></p>

        <!-- 만료 임박 배너 -->
        <div th:if="${expiryBanner}" class="rounded-xl px-4 py-3 mb-4 text-sm font-semibold bg-orange-50 text-orange-600">
            <span th:text="${#numbers.formatInteger(expiryBanner.amount, 1, 'COMMA')} + 'P가 '"></span>
            <span th:text="${expiryBanner.dDay == 0 ? '오늘' : expiryBanner.dDay + '일 후'} + ' (' + ${expiryBanner.expiredAt} + ') 만료돼요'"></span>
        </div>

        <!-- 필터 탭 -->
        <div class="flex gap-1.5 bg-white rounded-xl p-1 shadow-sm mb-4">
            <a th:href="@{/history(type='ALL')}" th:class="'flex-1 text-center text-sm font-bold rounded-lg py-2 ' + (${type == 'ALL'} ? 'bg-gray-900 text-white' : 'text-gray-400')">전체</a>
            <a th:href="@{/history(type='EARN')}" th:class="'flex-1 text-center text-sm font-bold rounded-lg py-2 ' + (${type == 'EARN'} ? 'bg-gray-900 text-white' : 'text-gray-400')">적립</a>
            <a th:href="@{/history(type='USE')}" th:class="'flex-1 text-center text-sm font-bold rounded-lg py-2 ' + (${type == 'USE'} ? 'bg-gray-900 text-white' : 'text-gray-400')">사용</a>
            <a th:href="@{/history(type='EXPIRE')}" th:class="'flex-1 text-center text-sm font-bold rounded-lg py-2 ' + (${type == 'EXPIRE'} ? 'bg-gray-900 text-white' : 'text-gray-400')">소멸</a>
        </div>

        <!-- 이번 달 요약 -->
        <div class="bg-white rounded-2xl shadow-sm p-5 mb-4 grid grid-cols-3 gap-2 text-center">
            <div>
                <span class="block text-lg font-extrabold text-brand-strong" th:text="${#numbers.formatInteger(summary.earned, 1, 'COMMA')}"></span>
                <span class="text-xs text-gray-400 font-semibold">이번 달 적립</span>
            </div>
            <div>
                <span class="block text-lg font-extrabold text-gray-800" th:text="${#numbers.formatInteger(summary.used, 1, 'COMMA')}"></span>
                <span class="text-xs text-gray-400 font-semibold">사용</span>
            </div>
            <div>
                <span class="block text-lg font-extrabold text-accent" th:text="${#numbers.formatInteger(summary.expiring, 1, 'COMMA')}"></span>
                <span class="text-xs text-gray-400 font-semibold">소멸 예정</span>
            </div>
        </div>

        <!-- 시간순 리스트 -->
        <p th:if="${groups.isEmpty()}" class="text-gray-400 text-sm text-center py-10">내역이 없어요.</p>
        <div th:each="g : ${groups}" class="mb-4">
            <p class="text-sm font-bold text-gray-500 mb-2 px-1" th:text="${g.dateLabel}"></p>
            <div class="bg-white rounded-2xl shadow-sm divide-y divide-gray-100">
                <div th:each="l : ${g.rows}" class="p-4">
                    <div class="flex items-center justify-between">
                        <div class="min-w-0">
                            <span class="text-sm font-semibold" th:text="${l.icon} + ' ' + ${l.label}"></span>
                        </div>
                        <span class="text-sm font-bold flex-none" th:text="${l.sign} + ${#numbers.formatInteger(l.amount, 1, 'COMMA')} + 'P'"
                              th:classappend="${l.sign == '+'} ? 'text-brand-strong' : 'text-red-500'"></span>
                    </div>
                    <p class="text-xs text-gray-400 mt-0.5">
                        <span th:text="${l.label}"></span>
                        <span th:if="${l.description}" th:text="' · ' + ${l.description}"></span>
                        <span th:if="${l.brand}" th:text="' · ' + ${l.brand}"></span>
                        <span th:if="${l.label == '사용' and !l.cancelable}"> · 취소 가능 기간이 지났어요</span>
                    </p>
                    <form th:if="${l.cancelable}" th:action="@{/history/points/cancel}" method="post" class="cancel-form mt-2.5"
                          th:attr="data-ledger-id=${l.ledgerId},data-description=${l.description},data-brand=${l.brand},data-amount=${l.amount}">
                        <input type="hidden" name="ledgerId" th:value="${l.ledgerId}"/>
                        <input type="hidden" name="type" th:value="${type}"/>
                        <button type="button" class="cancel-open-btn w-full h-10 border-2 border-brand text-brand-strong text-sm font-bold rounded-xl">사용 취소</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <!-- 사용 취소 확인 바텀시트 (S13) -->
    <div id="cancelSheet" class="hidden fixed inset-0 z-60">
        <div class="absolute inset-0 bg-black/40" onclick="closeSheet('cancelSheet')"></div>
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white rounded-t-2xl p-5">
            <div class="w-11 h-1 rounded-full bg-gray-200 mx-auto mb-4"></div>
            <div class="text-lg font-extrabold mb-3">이 사용 기록을 취소할까요?</div>
            <div class="bg-gray-50 rounded-xl px-4 py-3 mb-3">
                <p id="cancelTargetDescription" class="text-sm font-bold"></p>
                <p id="cancelTargetMeta" class="text-xs text-gray-400 mt-0.5"></p>
            </div>
            <div id="cancelPreviewArea" class="mb-3"></div>
            <div class="flex gap-2">
                <button type="button" onclick="closeSheet('cancelSheet')"
                        class="h-13 px-5 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold rounded-xl transition">아니요</button>
                <button type="button" onclick="submitCancelConfirm()"
                        class="flex-1 h-13 bg-brand hover:bg-brand-strong text-brand-ink hover:text-white font-bold rounded-xl transition">취소하기</button>
            </div>
        </div>
    </div>

    <script>
        function openSheet(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeSheet(id) { document.getElementById(id).classList.add('hidden'); }

        var cancelConfirmForm = null;
        function submitCancelConfirm() { if (cancelConfirmForm) cancelConfirmForm.submit(); }

        document.querySelectorAll('.cancel-open-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var form = btn.closest('.cancel-form');
                cancelConfirmForm = form;
                document.getElementById('cancelTargetDescription').textContent = form.dataset.description || '사용 내역';
                var amount = Number(form.dataset.amount).toLocaleString('ko-KR');
                var brand = form.dataset.brand ? form.dataset.brand + ' · ' : '';
                document.getElementById('cancelTargetMeta').textContent = brand + '오늘 · ' + amount + 'P 사용';
                htmx.ajax('POST', '/history/points/cancel/preview', {
                    target: '#cancelPreviewArea',
                    values: { ledgerId: form.querySelector('[name=ledgerId]').value }
                });
                openSheet('cancelSheet');
            });
        });
    </script>
</body>
</html>
