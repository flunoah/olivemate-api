<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 min-h-screen pb-20">
    <div class="max-w-sm mx-auto p-6">
        <div class="flex items-center justify-between mb-6">
            <div>
                <div class="text-lg font-bold text-gray-800" th:text="${crewName}"></div>
                <p class="text-gray-400 text-sm mt-0.5">내 소정근무일</p>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="text-sm text-gray-400 hover:text-red-500">로그아웃</button>
            </form>
        </div>

        <div class="bg-white rounded-2xl shadow-sm p-6">
            <p th:if="${schedule == null}" class="text-gray-400 text-sm text-center py-4">등록된 소정근무일이 없어요.</p>

            <form th:action="@{/mypage}" method="post" class="space-y-4">
                <div class="grid grid-cols-7 gap-2 text-center text-sm">
                    <label class="flex flex-col items-center gap-1">
                        <input type="checkbox" name="daysOfWeek" value="0" th:checked="${schedule != null and schedule.daysOfWeek.contains(0)}"/>
                        <span>일</span>
                    </label>
                    <label class="flex flex-col items-center gap-1">
                        <input type="checkbox" name="daysOfWeek" value="1" th:checked="${schedule != null and schedule.daysOfWeek.contains(1)}"/>
                        <span>월</span>
                    </label>
                    <label class="flex flex-col items-center gap-1">
                        <input type="checkbox" name="daysOfWeek" value="2" th:checked="${schedule != null and schedule.daysOfWeek.contains(2)}"/>
                        <span>화</span>
                    </label>
                    <label class="flex flex-col items-center gap-1">
                        <input type="checkbox" name="daysOfWeek" value="3" th:checked="${schedule != null and schedule.daysOfWeek.contains(3)}"/>
                        <span>수</span>
                    </label>
                    <label class="flex flex-col items-center gap-1">
                        <input type="checkbox" name="daysOfWeek" value="4" th:checked="${schedule != null and schedule.daysOfWeek.contains(4)}"/>
                        <span>목</span>
                    </label>
                    <label class="flex flex-col items-center gap-1">
                        <input type="checkbox" name="daysOfWeek" value="5" th:checked="${schedule != null and schedule.daysOfWeek.contains(5)}"/>
                        <span>금</span>
                    </label>
                    <label class="flex flex-col items-center gap-1">
                        <input type="checkbox" name="daysOfWeek" value="6" th:checked="${schedule != null and schedule.daysOfWeek.contains(6)}"/>
                        <span>토</span>
                    </label>
                </div>

                <div>
                    <label class="text-sm font-medium text-gray-600">적용일</label>
                    <input type="date" name="startDate"
                           th:value="${schedule != null ? schedule.startDate : null}"
                           class="mt-1 w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500"/>
                </div>

                <button type="submit"
                        onclick="return confirm('이 내용으로 변경할까요?')"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 rounded-lg transition">
                    변경하기
                </button>
            </form>
        </div>

        <div id="pushCard" style="background:#fff;border-radius:10px;border:0.5px solid #e0e0e0;padding:16px;margin-top:16px">
            <div style="display:flex;align-items:center;justify-content:space-between">
                <div>
                    <p style="font-size:14px;font-weight:600;color:#1a1a1a;margin:0">🔔 포인트 알림</p>
                    <p id="pushStatusText" style="font-size:12px;color:#888;margin:3px 0 0">적립·소멸 알림을 받아보세요</p>
                </div>
                <button id="pushToggleBtn" type="button"
                        style="padding:8px 16px;border-radius:20px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:#1B9E5B;color:#fff">
                    알림 켜기
                </button>
            </div>
            <p id="pushErrorText" style="font-size:11px;color:#E53935;margin:8px 0 0;display:none"></p>
        </div>
    </div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>
    <script src="/js/push.js"></script>
    <script>
        (function () {
            var card = document.getElementById('pushCard');
            var btn = document.getElementById('pushToggleBtn');
            var statusText = document.getElementById('pushStatusText');
            var errorText = document.getElementById('pushErrorText');
            var pushEnabled = false;

            function render() {
                btn.textContent = pushEnabled ? '알림 끄기' : '알림 켜기';
                btn.style.background = pushEnabled ? '#F0FAF4' : '#1B9E5B';
                btn.style.color = pushEnabled ? '#1B9E5B' : '#fff';
                statusText.textContent = pushEnabled
                    ? '적립·소멸 알림을 받고 있어요'
                    : '적립·소멸 알림을 받아보세요';
            }

            if (!isPushSupported()) {
                card.style.display = 'none';
                return;
            }

            getExistingSubscription().then(function (sub) {
                pushEnabled = !!sub;
                render();
            });

            btn.addEventListener('click', function () {
                btn.disabled = true;
                btn.style.opacity = '0.5';
                errorText.style.display = 'none';

                var action = pushEnabled ? unsubscribeFromPush() : subscribeToPush();
                action.then(function (ok) {
                    if (pushEnabled) {
                        if (ok) pushEnabled = false;
                        else {
                            errorText.textContent = '알림 끄기에 실패했어요. 잠시 후 다시 시도해주세요.';
                            errorText.style.display = 'block';
                        }
                    } else {
                        pushEnabled = ok;
                        if (!ok) {
                            errorText.textContent = '알림 켜기에 실패했어요. 브라우저 알림 권한을 확인하거나 잠시 후 다시 시도해주세요.';
                            errorText.style.display = 'block';
                        }
                    }
                    render();
                }).finally(function () {
                    btn.disabled = false;
                    btn.style.opacity = '1';
                });
            });
        })();
    </script>
</body>
</html>
