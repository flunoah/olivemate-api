<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-[#F4F6F1] min-h-screen pb-24">
    <div class="max-w-sm mx-auto p-5">
        <div class="flex items-center justify-between mb-4">
            <div class="text-lg font-extrabold tracking-tight">내 정보</div>
        </div>

        <!-- 프로필 카드 -->
        <div class="bg-white rounded-2xl shadow-sm p-5 mb-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-brand text-brand-ink flex items-center justify-center font-extrabold text-lg flex-none"
                     th:text="${#strings.isEmpty(crewName)} ? '?' : ${#strings.substring(crewName, 0, 1)}"></div>
                <div class="min-w-0">
                    <div class="font-extrabold" th:text="${crewName}"></div>
                    <div class="text-xs text-gray-400 font-semibold mt-0.5" th:text="'사번 ' + ${loginId}"></div>
                </div>
            </div>
            <div th:if="${lifetimeStats != null}" class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-gray-100 text-center">
                <div>
                    <span class="block text-lg font-extrabold text-brand-strong" th:text="${#numbers.formatInteger(lifetimeStats.totalEarned, 1, 'COMMA')} + 'P'"></span>
                    <span class="text-xs text-gray-400 font-semibold">누적 적립</span>
                </div>
                <div>
                    <span class="block text-lg font-extrabold text-gray-500" th:text="${#numbers.formatInteger(lifetimeStats.totalExpired, 1, 'COMMA')} + 'P'"></span>
                    <span class="text-xs text-gray-400 font-semibold">누적 소멸</span>
                </div>
            </div>
        </div>

        <!-- 근무 조건 -->
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden mb-4">
            <p class="px-5 pt-4 pb-2 text-xs font-bold text-gray-400">근무 조건</p>
            <button type="button" onclick="openScheduleSheet()"
                    class="w-full flex items-center justify-between px-5 py-4 border-t border-gray-100 text-left">
                <span>
                    <span class="block text-sm font-bold">소정근무 요일</span>
                    <span class="block text-xs text-gray-400 mt-0.5"
                          th:text="${schedule != null} ? ${scheduleDaysLabel} + ' (주 ' + ${schedule.daysOfWeek.size()} + '일)' : '등록된 요일이 없어요'"></span>
                </span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-300 flex-none"><path d="M9 5l7 7-7 7"/></svg>
            </button>
            <div class="flex items-center justify-between px-5 py-4 border-t border-gray-100">
                <span>
                    <span class="block text-sm font-bold">1일 적립 포인트</span>
                    <span class="block text-xs text-gray-400 mt-0.5">관리자가 설정 · 변경 불가</span>
                </span>
                <span class="text-xs font-bold text-gray-300">설정</span>
            </div>
        </div>

        <!-- 설정 -->
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden mb-4">
            <p class="px-5 pt-4 pb-2 text-xs font-bold text-gray-400">설정</p>
            <button type="button" onclick="openNotificationSettingsSheet()"
                    class="w-full flex items-center justify-between px-5 py-4 border-t border-gray-100 text-left">
                <span class="text-sm font-bold">알림 설정</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-300 flex-none"><path d="M9 5l7 7-7 7"/></svg>
            </button>
            <form th:action="@{/logout}" method="post" class="border-t border-gray-100">
                <button type="submit" class="w-full text-left px-5 py-4 text-sm font-bold text-red-500">로그아웃</button>
            </form>
        </div>
    </div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <!-- 소정근무 요일 변경 바텀시트 (S17) -->
    <div id="scheduleSheet" class="hidden fixed inset-0 z-60">
        <div class="absolute inset-0 bg-black/40" onclick="closeSheet('scheduleSheet')"></div>
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white rounded-t-2xl p-5">
            <div class="w-11 h-1 rounded-full bg-gray-200 mx-auto mb-4"></div>
            <div class="text-lg font-extrabold mb-1">정기 근무 요일을 바꿀까요?</div>
            <p class="text-xs text-gray-400 mb-4 leading-relaxed">변경은 다음 주부터 적용돼요. 이번 주 근무는 홈에서 직접 수정할 수 있어요.</p>
            <form th:action="@{/mypage}" method="post" id="scheduleForm">
                <div class="grid grid-cols-7 gap-2 text-center text-sm mb-3">
                    <label th:each="d, iter : ${ {'일','월','화','수','목','금','토'} }" class="flex flex-col items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" name="daysOfWeek" th:value="${iter.index}" class="peer sr-only schedule-day-checkbox"
                               th:checked="${schedule != null and schedule.daysOfWeek.contains(iter.index)}"
                               hx-get="/mypage/schedule/preview" hx-trigger="change" hx-include="[name='daysOfWeek']" hx-target="#schedulePreviewArea"/>
                        <span class="w-full aspect-square rounded-xl flex items-center justify-center font-bold text-xs bg-gray-100 text-gray-400 peer-checked:bg-brand peer-checked:text-brand-ink" th:text="${d}"></span>
                    </label>
                </div>
                <div id="schedulePreviewArea" class="mb-3"></div>
                <input type="hidden" name="startDate" id="scheduleStartDate"/>
                <div class="flex gap-2">
                    <button type="button" onclick="closeSheet('scheduleSheet')"
                            class="h-13 px-5 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold rounded-xl transition">닫기</button>
                    <button type="submit" class="flex-1 h-13 bg-brand hover:bg-brand-strong text-brand-ink hover:text-white font-bold rounded-xl transition">변경 적용</button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/notification-settings-sheet :: sheet}"></div>

    <script>
        function openSheet(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeSheet(id) { document.getElementById(id).classList.add('hidden'); }

        function nextMondayIso() {
            var d = new Date();
            var day = d.getDay(); // 0=일~6=토
            var daysUntilMonday = day === 0 ? 1 : (8 - day);
            d.setDate(d.getDate() + daysUntilMonday);
            return d.toISOString().slice(0, 10);
        }

        function openScheduleSheet() {
            document.getElementById('scheduleStartDate').value = nextMondayIso();
            openSheet('scheduleSheet');
        }
    </script>
</body>
</html>
