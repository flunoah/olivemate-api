<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="results" class="absolute z-10 w-full bg-white border border-gray-200 rounded-xl mt-1 max-h-64 overflow-y-auto shadow-lg">
        <div th:each="p : ${results}" class="product-search-item px-4 py-2.5 text-sm hover:bg-gray-50 flex items-center justify-between gap-2"
             th:attr="data-name=${p.name},data-brand=${p.brand},data-price=${p.salePrice}">
            <span class="cursor-pointer flex-1 min-w-0">
                <span class="font-semibold" th:text="${p.name}"></span>
                <span class="text-gray-400 ml-1 text-xs" th:text="${p.brand} + ' · ' + ${#numbers.formatInteger(p.salePrice, 1, 'COMMA')} + '원'"></span>
            </span>
            <button type="button" class="product-correction-btn text-xs font-bold text-gray-400 hover:text-brand-strong flex-none"
                    th:attr="data-id=${p.id},data-name=${p.name},data-brand=${p.brand}">정정 요청</button>
        </div>
        <div th:if="${results.isEmpty() and query != null and !query.isBlank()}" class="px-4 py-3 bg-red-50 border border-red-200 rounded-xl m-1">
            <p class="text-sm font-bold text-red-500">카탈로그에서 찾지 못했어요</p>
            <p class="text-xs text-red-400 mt-1 leading-relaxed">상품 DB에 직접 쓰지 않아요. 관리자에게 등록 요청을 보내고, 사용 등록은 임시 항목으로 계속 진행돼요.</p>
            <button type="button" id="productNewRequestBtn" th:attr="data-name=${query}"
                    class="mt-2 text-xs font-bold text-red-500 bg-white border border-red-200 rounded-lg px-3 py-1.5">상품 등록 요청 보내기</button>
        </div>
    </div>
</body>
</html>
