<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-2xl mx-auto p-6">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <a th:href="@{/admin}" class="text-sm text-gray-400 hover:text-gray-600">← 관리자 홈</a>
                <h1 class="text-xl font-bold text-gray-800">상품 관리</h1>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="text-sm text-gray-400 hover:text-red-500">로그아웃</button>
            </form>
        </div>

        <p th:if="${error}" th:text="${error}" class="text-red-500 text-sm mb-4"></p>
        <p th:if="${result}"
           th:text="'업로드 완료 — 총 ' + ${result.total} + '건, 성공 ' + ${result.synced} + '건, 실패 ' + ${result.failed} + '건'"
           class="text-green-600 text-sm mb-4"></p>

        <div class="bg-white rounded-2xl shadow-sm p-6">
            <p class="text-sm font-medium text-gray-700 mb-2">엑셀 업로드</p>
            <p class="text-xs text-gray-400 mb-4">열 순서: 상품코드, 브랜드, 상품명, 정가, 판매가 (1행은 헤더)</p>
            <form th:action="@{/admin/products/upload}" method="post" enctype="multipart/form-data" class="flex gap-2">
                <input type="file" name="file" accept=".xlsx,.xls" required
                       class="flex-1 text-sm border border-gray-200 rounded-lg px-3 py-2.5"/>
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-medium px-4 rounded-lg transition">업로드</button>
            </form>
        </div>
    </div>
</body>
</html>
