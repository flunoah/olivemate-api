<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-2xl mx-auto p-6">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-xl font-bold text-gray-800">관리자 - 크루 목록</h1>
            <div class="flex items-center gap-3">
                <a th:href="@{/admin/products}" class="text-sm text-green-600 font-medium hover:underline">상품 관리</a>
                <a th:href="@{/admin/product-requests}" class="text-sm text-green-600 font-medium hover:underline">상품 등록 요청</a>
                <a th:href="@{/admin/crews/new}" class="text-sm text-green-600 font-medium hover:underline">+ 크루 등록</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="text-sm text-gray-400 hover:text-red-500">로그아웃</button>
                </form>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <table class="w-full text-sm text-left">
                <thead class="bg-gray-50 text-gray-500">
                    <tr>
                        <th class="px-4 py-3 font-medium">이름</th>
                        <th class="px-4 py-3 font-medium">사번</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="crew : ${crews}" class="border-t border-gray-100 hover:bg-gray-50">
                        <td class="px-4 py-3">
                            <a th:href="@{/admin/crews/{id}(id=${crew.crewId})}" th:text="${crew.name}" class="text-gray-800 hover:text-green-600"></a>
                        </td>
                        <td class="px-4 py-3 text-gray-500" th:text="${crew.loginId}"></td>
                    </tr>
                    <tr th:if="${crews.isEmpty()}">
                        <td colspan="2" class="px-4 py-6 text-center text-gray-400">등록된 크루가 없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
